# ManifestDexCore supplemental patterns.
#
# These functions are ManifestDexCore-specific and are deliberately kept OUT of
# the shared steam-monitor repo (that repo tracks Steam client functions used by
# OpenSteamTool). They ship next to the tool itself, so they can be updated
# without waiting on — or forking — the remote signature cache.
#
# Loaded by dllmain.cpp via PatternLoader::LoadSupplement(), which merges them
# into the module's pattern map alongside the remote entries. The same FNV-1a
# keyed [0xHHHHHHHH] / name / rva / sig format applies; FindPattern() then
# prefers `rva`, falling back to `sig` exactly like the remote parser.

[0xAECAAF89]
name = "LegacyKeyRegistrationMethod"
rva = "0x4A9DC0"
sig = "48 83 EC 28 8B 15 ?? ?? ?? ?? 45 33 C0 48 8B 49 40 E8 ?? ?? ?? ?? 48 85"