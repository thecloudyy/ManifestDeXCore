# ManifestDexCore supplemental patterns (steamui.dll).
#
# These functions were previously hardcoded in src/Utils/UpdateChecker.cpp for
# the "update available" Steam QueryBox dialog. They are ManifestDexCore-specific
# and are kept OUT of the shared steam-monitor repo. Moved here so they resolve
# through PatternLoader::FindPattern like every other hook.
#
# Same FNV-1a keyed [0xHHHHHHHH] / name / rva / sig format as the remote parser.
# FindPattern() prefers `rva`, falling back to `sig` scan. NOTE: sig wildcards
# here use `??` (two chars per wildcard byte), matching PatternLoader::ParseSig.

