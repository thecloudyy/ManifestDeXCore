name: Build
run-name: ${{ github.event.inputs.version }} Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config" -DOPENSTEAMTOOL_VERSION="${{ github.event.inputs.version }}"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Build Debug
        run: cmake --build build --config Debug

      - uses: actions/upload-artifact@v4
        with:
          name: ManifestDexCore-Release
          path: build/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: ManifestDexCore-Debug
          path: build/Debug/

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Download `dwmapi.dll`, `xinput1_4.dll` and `manifestdexcore.dll` and copy them to your Steam root directory (e.g. `C:\Program Files (x86)\Steam`).

            Place your Lua scripts in `C:\Program Files (x86)\Steam\config\stplug-in`.
          files: |
            build/Release/dwmapi.dll
            build/Release/xinput1_4.dll
            build/Release/manifestdexcore.dll
